<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Widgets that fit</title>
    <meta name="description" content="A demo site for the beacon self-hosting example." />
  </head>
  <body>
    <main>
      <h1>Widgets that fit</h1>
      <p>
        This page exists so <code>beacon build</code> has something to convert.
        Ask for it as Markdown and you get the twin instead of the HTML.
      </p>
      <h2>Why twins</h2>
      <p>
        An AI client reading HTML spends most of its context on markup it will
        throw away. The Markdown twin is the same content without the chrome.
      </p>
    </main>
  </body>
</html>
