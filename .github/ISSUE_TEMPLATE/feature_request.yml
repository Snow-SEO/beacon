name: Feature request
description: Something beacon should do and does not.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does beacon get in the way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds you found, and why they are not enough.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This would change the wire protocol between client and server.
