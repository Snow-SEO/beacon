name: Release

# Publishing runs here and nowhere else, because two things only CI gets right.
#
#  1. `pnpm pack` rewrites `workspace:^` into a real range; `npm pack` does not.
#     0.1.2 shipped with the literal `"@snowseo/beacon": "workspace:^"` in its
#     dependencies and is uninstallable by every client (npm:
#     EUNSUPPORTEDPROTOCOL, pnpm: ERR_PNPM_WORKSPACE_PKG_NOT_FOUND). 0.1.0 and
#     0.1.1 were fine, so the only difference was the command someone happened
#     to type. Pinning it to a workflow is what stops it recurring.
#
#  2. Provenance. It is minted from the OIDC token below, which exists only
#     inside Actions, so a laptop publish can never produce an attestation.
#
# Auth is npm trusted publishing: npm matches the OIDC token against a rule
# configured on npmjs.com, so there is no long-lived write token in this repo
# to leak. That also means provenance needs no flag - publishing over OIDC
# attaches it automatically.
#
# The split is deliberate: pnpm packs (it understands the workspace protocol),
# npm publishes (it understands OIDC). Neither tool does both.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Mints the OIDC token npm authenticates against. Without it the publish
      # fails outright rather than silently shipping an unsigned tarball.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          # Trusted publishing needs npm >= 11.5.1, which node 24 ships.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same gate CI applies to every push. Run before packing: a failure
      # after the first package is already on npm cannot be undone.
      - run: pnpm check
      - run: pnpm build
      - run: pnpm type-check
      - run: pnpm test

      # Refuse a tag that disagrees with the manifests, which would otherwise
      # put v0.1.3 on a tarball built from 0.1.2 sources.
      - name: Verify tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in packages/beacon packages/beacon-server; do
            version=$(node -p "require('./$pkg/package.json').version")
            if [ "$version" != "$tag" ]; then
              echo "::error::$pkg is $version but the tag is $tag"
              exit 1
            fi
          done
          echo "tag $tag matches both packages"

      - name: Pack
        run: |
          pnpm --filter @snowseo/beacon pack --pack-destination "$RUNNER_TEMP"
          pnpm --filter @snowseo/beacon-server pack --pack-destination "$RUNNER_TEMP"

      # Fail loudly rather than shipping the bug this workflow exists to stop.
      - name: Verify the workspace protocol was rewritten
        run: |
          version=$(node -p "require('./packages/beacon/package.json').version")
          dep=$(tar -xzOf "$RUNNER_TEMP/snowseo-beacon-server-$version.tgz" package/package.json \
            | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).dependencies["@snowseo/beacon"]')
          if [ "${dep#workspace:}" != "$dep" ]; then
            echo "::error::beacon-server still declares '$dep' - do not publish"
            exit 1
          fi
          echo "beacon-server depends on @snowseo/beacon@$dep"

      # beacon first: beacon-server depends on it, so a consumer installing the
      # server the moment it appears must find the client already there.
      #
      # Skips a version already on the registry, so re-running after a partial
      # failure republishes only what is missing.
      - name: Publish
        run: |
          version=$(node -p "require('./packages/beacon/package.json').version")
          for name in beacon beacon-server; do
            if npm view "@snowseo/$name@$version" version >/dev/null 2>&1; then
              echo "@snowseo/$name@$version is already published, skipping"
              continue
            fi
            npm publish "$RUNNER_TEMP/snowseo-$name-$version.tgz" --access public
          done
